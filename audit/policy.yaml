apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
  # No verb filter on the interactive subresources: SPDY exec is audited as "create",
  # WebSocket exec (kubectl >= 1.31) may be audited as "get".
  - level: Metadata
    resources:
      - group: ""
        resources: [pods/exec, pods/attach, pods/portforward]
  - level: Metadata
    verbs: [create, update, patch, delete]
    resources:
      - group: ""
        resources: [pods, pods/status]
  - level: None
