# Breaks most policies but lives in an excluded namespace, so the privileged rule must skip it.
apiVersion: v1
kind: Pod
metadata:
  name: falco-privileged-pod
  namespace: falco
spec:
  containers:
    - name: falco
      image: falcosecurity/falco:latest
      securityContext:
        privileged: true
