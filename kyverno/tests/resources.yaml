# Pods exercised by kyverno/tests/kyverno-test.yaml. good-pod satisfies every policy; each other Pod
# breaks exactly one of them.
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: nginx:1.27
      resources:
        limits: {cpu: 250m, memory: 128Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-pod
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: nginx:1.27
      resources:
        limits: {cpu: 250m, memory: 128Mi}
      securityContext:
        privileged: true
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: default
spec:
