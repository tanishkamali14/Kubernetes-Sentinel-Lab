      hostPath:
        path: /
  containers:
    - name: app
      image: nginx:1.27
      resources:
        limits: {cpu: 250m, memory: 128Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
